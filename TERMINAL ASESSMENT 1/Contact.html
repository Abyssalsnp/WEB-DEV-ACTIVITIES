<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
        <h1><tt>Communicate Through Here!</tt></h1>
        <p><tt>Drop a Line and Keep in Touch</tt></p>
    </header>


    <nav>
        <a href="Home.html">Home (Main)</a>
        <a href="about.html">About Me</a>
        <a href="contact.html" class="active">Contact Me</a>
    </nav>


    <main>
        <div class="grid-container">
            <section class="full-width">
                <h2><tt>Contact Form</tt></h2>
                <p style="margin-bottom: 20px;"><tt>Have a question or want to collaborate? Fill out the form fields verified below to instantly drop me a message!</tt></p>
               
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="student_name" placeholder="John Doe" required>
                    </div>


                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="student_email" placeholder="example@email.com" required>
                    </div>


                    <div class="form-group">
                        <label for="message">Your Message:</label>
                        <textarea id="message" name="student_message" rows="6" placeholder="Write your message details here..." required></textarea>
                    </div>


                    <button type="submit">Send Message</button>
                </form>
            </section>
        </div>
    </main>


    <footer>
        <p><tt>&copy; 2026 Student Profile Project. All rights reserved.</tt></p>
    </footer>


</body>
</html>
