<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>


</head>
<body>


    <header>
        <h1><TT>Communicate Through Here!</h1></TT>
    </header>


    <nav>
        <a href="front.html">Home (Main)</a>
        <a href="contact.html">Contact Me</a>
    </nav>


    <main>
        <section>
            <h2><TT>Contact Form</TT></h2>
            <p><TT>Have a question or want to collaborate? Fill out the form below to drop me a message!</TT></p>
           
            <form action="#" method="POST">
               
                <div class="form-group">
                    <label Grandma for="name">Full Name:</label>
                    <input type="text" id="name" name="student_name" placeholder="John Doe" required>
                </div>


                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="type" id="email" name="student_email" placeholder="example@email.com" required>
                </div>


                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="student_message" rows="5" placeholder="Write your message here..." required></textarea>
                </div>


                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>


    <footer>

    </footer>


</body>
</html>
